[project]
name = "reserving"
version = "0.1.0"
description = "Non-life loss reserving on the CAS Loss Reserving Database: chain ladder, Mack, over-dispersed Poisson bootstrap, Bornhuetter-Ferguson and Cape Cod, backtested on the lower triangles"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
